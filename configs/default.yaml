# configs/default.yaml
project:
  name: "NanoTuner-3B"
  owner: "zumer"

model:
  id: "microsoft/Phi-3-mini-4k-instruct"
  # ADDED THIS: The missing link!
  dataset_id: "mlabonne/guanaco-llama2-1k" 
  trust_remote_code: true
  dtype: "bfloat16"

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  # CHANGED: Explicit list is safer than "all-linear" for standard PEFT
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  batch_size: 2
  grad_accum: 4
  epochs: 1
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  context_window: 2048
  optimizer: "paged_adamw_32bit"
  
hub:
  push: true
  private: false
  # This will be the name of the repo created on your account
  model_id: "NanoTuner-Phi3-Adapter"